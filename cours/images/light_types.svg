<svg width="900" height="380" viewBox="0 0 900 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <radialGradient id="hemiSky" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#b8d8f0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b8d8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hemiGround" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#6b4a2b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6b4a2b" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrDir" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f5a623"/>
    </marker>
    <marker id="arrSpot" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f5a623"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="#ffffff"/>

  <!-- ===== HemisphericLight ===== -->
  <g transform="translate(112,180)">
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">HemisphericLight</text>
    <text x="0" y="-112" text-anchor="middle" font-size="12" fill="#666">ambiance (ciel + sol)</text>
    <!-- dome ciel -->
    <path d="M -80 0 A 80 80 0 0 1 80 0" fill="url(#hemiSky)" stroke="#7aa8c8" stroke-width="1.2"/>
    <!-- dome sol -->
    <path d="M -80 0 A 80 80 0 0 0 80 0" fill="url(#hemiGround)" stroke="#6b4a2b" stroke-width="1.2"/>
    <!-- ligne de separation -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#444" stroke-width="1.5"/>
    <!-- direction (axe haut/bas) -->
    <line x1="0" y1="60" x2="0" y2="-60" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrDir)"/>
    <text x="-72" y="-15" font-size="12" fill="#2c6fb0">ciel</text>
    <text x="-72" y="18" font-size="12" fill="#6b4a2b">sol</text>
    <text x="0" y="100" text-anchor="middle" font-size="11" fill="#555">pas de position</text>
  </g>

  <!-- ===== DirectionalLight ===== -->
  <g transform="translate(337,180)">
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DirectionalLight</text>
    <text x="0" y="-112" text-anchor="middle" font-size="12" fill="#666">le soleil (rayons parallèles)</text>
    <!-- rayons paralleles -->
    <g stroke="#f5a623" stroke-width="2" marker-end="url(#arrDir)">
      <line x1="-60" y1="-70" x2="-30" y2="40"/>
      <line x1="-30" y1="-70" x2="0" y2="40"/>
      <line x1="0" y1="-70" x2="30" y2="40"/>
      <line x1="30" y1="-70" x2="60" y2="40"/>
    </g>
    <!-- sol -->
    <line x1="-80" y1="50" x2="80" y2="50" stroke="#444" stroke-width="2"/>
    <g stroke="#bbb" stroke-width="1">
      <line x1="-80" y1="50" x2="-90" y2="62"/>
      <line x1="-50" y1="50" x2="-60" y2="62"/>
      <line x1="-20" y1="50" x2="-30" y2="62"/>
      <line x1="10" y1="50" x2="0" y2="62"/>
      <line x1="40" y1="50" x2="30" y2="62"/>
      <line x1="70" y1="50" x2="60" y2="62"/>
    </g>
    <text x="0" y="100" text-anchor="middle" font-size="11" fill="#555">source infiniment lointaine</text>
  </g>

  <!-- ===== PointLight ===== -->
  <g transform="translate(562,180)">
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">PointLight</text>
    <text x="0" y="-112" text-anchor="middle" font-size="12" fill="#666">l'ampoule (toutes directions)</text>
    <!-- source -->
    <circle cx="0" cy="-10" r="10" fill="#f5a623" stroke="#7a5300" stroke-width="1.5"/>
    <!-- rayons radiaux -->
    <g stroke="#f5a623" stroke-width="1.8" marker-end="url(#arrDir)">
      <line x1="0" y1="-10" x2="0" y2="60"/>
      <line x1="0" y1="-10" x2="60" y2="40"/>
      <line x1="0" y1="-10" x2="-60" y2="40"/>
      <line x1="0" y1="-10" x2="70" y2="-10"/>
      <line x1="0" y1="-10" x2="-70" y2="-10"/>
      <line x1="0" y1="-10" x2="50" y2="-50"/>
      <line x1="0" y1="-10" x2="-50" y2="-50"/>
    </g>
    <!-- cercle de portee (range) -->
    <circle cx="0" cy="-10" r="78" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="62" y="-30" font-size="11" fill="#666">range</text>
    <text x="0" y="100" text-anchor="middle" font-size="11" fill="#555">atténuation avec la distance</text>
  </g>

  <!-- ===== SpotLight ===== -->
  <g transform="translate(787,180)">
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SpotLight</text>
    <text x="0" y="-112" text-anchor="middle" font-size="12" fill="#666">le projecteur (cône)</text>
    <!-- source -->
    <circle cx="0" cy="-70" r="8" fill="#f5a623" stroke="#7a5300" stroke-width="1.5"/>
    <!-- cone -->
    <path d="M 0 -70 L -55 50 L 55 50 Z" fill="#f5a623" fill-opacity="0.25" stroke="#f5a623" stroke-width="1.5"/>
    <!-- axe direction -->
    <line x1="0" y1="-70" x2="0" y2="50" stroke="#7a5300" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrSpot)"/>
    <!-- angle demi-ouverture -->
    <path d="M 0 -40 A 30 30 0 0 1 28 -25" fill="none" stroke="#c0392b" stroke-width="1.2"/>
    <text x="14" y="-30" font-size="12" fill="#c0392b" font-style="italic">θ</text>
    <!-- sol -->
    <line x1="-70" y1="50" x2="70" y2="50" stroke="#444" stroke-width="2"/>
    <text x="0" y="100" text-anchor="middle" font-size="11" fill="#555">position + direction + angle</text>
  </g>

  <text x="450" y="365" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Les quatre types de lumières intégrées de Babylon.js.</text>
</svg>
