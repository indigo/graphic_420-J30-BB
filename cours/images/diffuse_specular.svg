<svg width="900" height="380" viewBox="0 0 900 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <radialGradient id="diffOnly" cx="32%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#e84a4a"/>
      <stop offset="40%" stop-color="#a02020"/>
      <stop offset="80%" stop-color="#3a0808"/>
      <stop offset="100%" stop-color="#1a0202"/>
    </radialGradient>
    <radialGradient id="specOnly" cx="32%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="combined" cx="32%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#ffd0d0"/>
      <stop offset="45%" stop-color="#c02020"/>
      <stop offset="80%" stop-color="#3a0808"/>
      <stop offset="100%" stop-color="#1a0202"/>
    </radialGradient>
  </defs>

  <rect width="900" height="380" fill="#ffffff"/>

  <!-- Lumiere commune -->
  <g font-size="13" fill="#7a6a00">
    <circle cx="60" cy="80" r="20" fill="#FFD000"/>
    <text x="60" y="120" text-anchor="middle">Lumière</text>
  </g>

  <!-- 1. Diffus seul -->
  <g transform="translate(225,190)">
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Diffuse (Lambert)</text>
    <text x="0" y="-112" text-anchor="middle" font-size="12" fill="#666">max(N · L, 0) × matériau</text>
    <circle cx="0" cy="0" r="90" fill="url(#diffOnly)" stroke="#222" stroke-width="1.2"/>
    <text x="0" y="120" text-anchor="middle" font-size="12" fill="#555">dégradé continu, pas de reflet</text>
  </g>

  <!-- 2. Speculaire seul -->
  <g transform="translate(450,190)">
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Spéculaire (Blinn-Phong)</text>
    <text x="0" y="-112" text-anchor="middle" font-size="12" fill="#666">max(N · H, 0)^shininess</text>
    <circle cx="0" cy="0" r="90" fill="#1a1a1a" stroke="#222" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="90" fill="url(#specOnly)"/>
    <text x="0" y="120" text-anchor="middle" font-size="12" fill="#555">tache brillante qui suit la caméra</text>
  </g>

  <!-- 3. Combine -->
  <g transform="translate(675,190)">
    <text x="0" y="-130" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Diffuse + Spéculaire</text>
    <text x="0" y="-112" text-anchor="middle" font-size="12" fill="#666">résultat final du shader</text>
    <circle cx="0" cy="0" r="90" fill="url(#combined)" stroke="#222" stroke-width="1.2"/>
    <text x="0" y="120" text-anchor="middle" font-size="12" fill="#555">forme révélée + matière révélée</text>
  </g>

  <!-- Fleches + -->
  <text x="337" y="195" text-anchor="middle" font-size="28" fill="#222" font-weight="bold">+</text>
  <text x="562" y="195" text-anchor="middle" font-size="28" fill="#222" font-weight="bold">=</text>

  <text x="450" y="365" text-anchor="middle" font-size="13" fill="#555" font-style="italic">La composante diffuse révèle la couleur et la forme ; la spéculaire révèle la brillance et la matière.</text>
</svg>
