<svg width="920" height="380" viewBox="0 0 920 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <radialGradient id="ptGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="380" fill="#ffffff"/>

  <text x="460" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Ombres omnidirectionnelles — cube shadow map</text>
  <text x="460" y="40" text-anchor="middle" font-size="12" fill="#666">une lumière ponctuelle éclaire dans les 6 directions ; il faut 6 depth maps (une par face du cube)</text>

  <!-- ===== Scène avec point light ===== -->
  <g transform="translate(60,80)">
    <!-- cube déplié (cross) -->
    <g transform="translate(180,120)">
      <!-- face arrière (centre) -->
      <rect x="-40" y="-40" width="80" height="80" fill="#f7f7f4" stroke="#888" stroke-width="1.4"/>
      <text x="0" y="-50" text-anchor="middle" font-size="10" fill="#888">+Z (arrière)</text>
      <!-- haut -->
      <rect x="-40" y="-120" width="80" height="80" fill="#eef4fb" stroke="#2c6fb0" stroke-width="1.4"/>
      <text x="0" y="-78" text-anchor="middle" font-size="10" fill="#2c6fb0">+Y (haut)</text>
      <!-- bas -->
      <rect x="-40" y="40" width="80" height="80" fill="#eef4fb" stroke="#2c6fb0" stroke-width="1.4"/>
      <text x="0" y="84" text-anchor="middle" font-size="10" fill="#2c6fb0">-Y (bas)</text>
      <!-- gauche -->
      <rect x="-120" y="-40" width="80" height="80" fill="#eaf5ee" stroke="#2c8a4a" stroke-width="1.4"/>
      <text x="-80" y="-50" text-anchor="middle" font-size="10" fill="#2c8a4a">-X (g)</text>
      <!-- droite -->
      <rect x="40" y="-40" width="80" height="80" fill="#eaf5ee" stroke="#2c8a4a" stroke-width="1.4"/>
      <text x="80" y="-50" text-anchor="middle" font-size="10" fill="#2c8a4a">+X (d)</text>
      <!-- avant -->
      <rect x="120" y="-40" width="80" height="80" fill="#f7f7f4" stroke="#888" stroke-width="1.4"/>
      <text x="160" y="-50" text-anchor="middle" font-size="10" fill="#888">-Z (avant)</text>

      <!-- point lumineux au centre -->
      <circle cx="0" cy="0" r="14" fill="url(#ptGlow)"/>
      <circle cx="0" cy="0" r="6" fill="#fff4c2" stroke="#e0921a" stroke-width="1.4"/>
      <text x="0" y="20" text-anchor="middle" font-size="10" fill="#7a5300">PointLight</text>

      <!-- rayons vers les 6 faces -->
      <g stroke="#f5a623" stroke-width="1.2" stroke-dasharray="3 3">
        <line x1="0" y1="0" x2="0" y2="-40"/>
        <line x1="0" y1="0" x2="0" y2="40"/>
        <line x1="0" y1="0" x2="-40" y2="0"/>
        <line x1="0" y1="0" x2="40" y2="0"/>
        <line x1="0" y1="0" x2="120" y2="0"/>
        <line x1="0" y1="0" x2="-120" y2="0"/>
      </g>
    </g>
    <text x="180" y="280" text-anchor="middle" font-size="11" fill="#555">Cube map de profondeur : 6 faces, 6 rendus depuis la lumière</text>
  </g>

  <!-- ===== Schéma 3D équivalent ===== -->
  <g transform="translate(560,90)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Vue en coupe</text>
    <!-- cube en perspective (carré) -->
    <rect x="60" y="40" width="200" height="200" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="5 4"/>
    <!-- lumière au centre -->
    <circle cx="160" cy="140" r="14" fill="url(#ptGlow)"/>
    <circle cx="160" cy="140" r="6" fill="#fff4c2" stroke="#e0921a" stroke-width="1.4"/>
    <!-- objets autour -->
    <rect x="90" y="90" width="30" height="30" fill="#6b7280" stroke="#374151" stroke-width="1.4"/>
    <rect x="220" y="170" width="35" height="35" fill="#9ca3af" stroke="#4b5563" stroke-width="1.4"/>
    <rect x="100" y="190" width="28" height="28" fill="#6b7280" stroke="#374151" stroke-width="1.4"/>
    <!-- rayons vers objets -->
    <g stroke="#f5a623" stroke-width="1.2" stroke-dasharray="3 3">
      <line x1="160" y1="140" x2="105" y2="105"/>
      <line x1="160" y1="140" x2="237" y2="187"/>
      <line x1="160" y1="140" x2="114" y2="204"/>
    </g>
    <!-- ombres portées (approx) -->
    <ellipse cx="105" cy="122" rx="18" ry="4" fill="#111" fill-opacity="0.4"/>
    <ellipse cx="237" y="207" rx="20" ry="4" fill="#111" fill-opacity="0.4"/>

    <text x="160" y="265" text-anchor="middle" font-size="11" fill="#555">La lumière "voit" dans les 6 directions ;</text>
    <text x="160" y="280" text-anchor="middle" font-size="11" fill="#555">chaque face du cube capture la profondeur d'une moitié.</text>
  </g>

  <text x="460" y="365" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Pour un PointLight, on rend la scène 6 fois (une par face du cube) depuis la position de la lumière. Coût : 6× plus cher qu'une shadow map directionnelle.</text>
</svg>
