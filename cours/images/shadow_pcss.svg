<svg width="940" height="360" viewBox="0 0 940 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <radialGradient id="extGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="940" height="360" fill="#ffffff"/>

  <text x="470" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">PCSS — pénombre variable selon la distance au bloqueur</text>
  <text x="470" y="40" text-anchor="middle" font-size="12" fill="#666">plus le bloqueur est proche de l'objet, plus l'ombre est dure ; plus il est loin, plus elle est floue</text>

  <!-- ===== Objet proche du bloqueur : ombre dure ===== -->
  <g transform="translate(40,80)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Bloqueur proche ⇒ ombre dure</text>
    <!-- source étendue -->
    <ellipse cx="160" cy="60" rx="50" ry="14" fill="url(#extGlow)" stroke="#e0921a" stroke-width="1.4"/>
    <text x="160" y="48" text-anchor="middle" font-size="10" fill="#7a5300">source étendue</text>
    <!-- bloqueur (petit cube) -->
    <rect x="145" y="120" width="30" height="30" fill="#374151" stroke="#111" stroke-width="1.4"/>
    <text x="160" y="165" text-anchor="middle" font-size="10" fill="#374151">bloqueur</text>
    <!-- objet qui reçoit (proche) -->
    <line x1="40" y1="180" x2="280" y2="180" stroke="#444" stroke-width="2"/>
    <!-- rayons extremes -->
    <g stroke="#f5a623" stroke-width="1" stroke-dasharray="3 3">
      <line x1="115" y1="60" x2="145" y2="120"/>
      <line x1="145" y1="120" x2="135" y2="180"/>
      <line x1="205" y1="60" x2="175" y2="120"/>
      <line x1="175" y1="120" x2="185" y2="180"/>
    </g>
    <!-- ombre étroite -->
    <rect x="135" y="180" width="50" height="5" fill="#111" fill-opacity="0.6"/>
    <text x="160" y="210" text-anchor="middle" font-size="11" fill="#c0392b">pénombre étroite</text>
  </g>

  <!-- ===== Objet loin du bloqueur : ombre floue ===== -->
  <g transform="translate(380,80)">
    <text x="200" y="0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Bloqueur loin ⇒ ombre floue</text>
    <ellipse cx="200" cy="60" rx="50" ry="14" fill="url(#extGlow)" stroke="#e0921a" stroke-width="1.4"/>
    <text x="200" y="48" text-anchor="middle" font-size="10" fill="#7a5300">source étendue</text>
    <!-- bloqueur -->
    <rect x="185" y="120" width="30" height="30" fill="#374151" stroke="#111" stroke-width="1.4"/>
    <text x="200" y="165" text-anchor="middle" font-size="10" fill="#374151">bloqueur</text>
    <!-- objet qui reçoit (loin) -->
    <line x1="40" y1="240" x2="360" y2="240" stroke="#444" stroke-width="2"/>
    <!-- rayons extremes (plus écartés) -->
    <g stroke="#f5a623" stroke-width="1" stroke-dasharray="3 3">
      <line x1="155" y1="60" x2="185" y2="120"/>
      <line x1="185" y1="120" x2="120" y2="240"/>
      <line x1="245" y1="60" x2="215" y2="120"/>
      <line x1="215" y1="120" x2="280" y2="240"/>
    </g>
    <!-- ombre large et floue -->
    <rect x="160" y="240" width="80" height="5" fill="#111" fill-opacity="0.5"/>
    <rect x="140" y="240" width="20" height="5" fill="#111" fill-opacity="0.25"/>
    <rect x="240" y="240" width="20" height="5" fill="#111" fill-opacity="0.25"/>
    <rect x="125" y="240" width="15" height="5" fill="#111" fill-opacity="0.12"/>
    <rect x="260" y="240" width="15" height="5" fill="#111" fill-opacity="0.12"/>
    <text x="200" y="270" text-anchor="middle" font-size="11" fill="#2c8a4a">pénombre large (flou)</text>
  </g>

  <!-- ===== Formule ===== -->
  <g transform="translate(720,90)">
    <rect x="0" y="0" width="200" height="180" rx="6" fill="#eef4fb" stroke="#2c6fb0" stroke-width="1"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c4a80">Taille du filtre</text>
    <text x="100" y="48" text-anchor="middle" font-size="11" fill="#222">w_penumbra ∝</text>
    <text x="100" y="66" text-anchor="middle" font-size="11" fill="#222">(d_receiver − d_blocker)</text>
    <text x="100" y="84" text-anchor="middle" font-size="11" fill="#222">÷ d_blocker</text>
    <text x="10" y="112" font-size="10" fill="#555">d_blocker = distance</text>
    <text x="10" y="126" font-size="10" fill="#555">  lumière→bloqueur</text>
    <text x="10" y="146" font-size="10" fill="#555">d_receiver = distance</text>
    <text x="10" y="160" font-size="10" fill="#555">  lumière→receveur</text>
  </g>

  <text x="470" y="345" text-anchor="middle" font-size="13" fill="#555" font-style="italic">PCSS estime la distance du bloqueur (blocker search) puis calcule la taille du filtre PCF en conséquence. Coût : plus élevé, mais ombres réalistes.</text>
</svg>
