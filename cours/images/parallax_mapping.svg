<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a070"/>
      <stop offset="50%" stop-color="#a07050"/>
      <stop offset="100%" stop-color="#c8a070"/>
    </linearGradient>
  </defs>

  <!-- Left: flat surface (normal map only) -->
  <g transform="translate(20, 30)">
    <text x="100" y="-10" text-anchor="middle" font-weight="bold">Normal map seule</text>
    <!-- Flat surface seen at angle -->
    <polygon points="10,80 190,80 210,120 -10,120" fill="url(#brickGrad)" stroke="#888"/>
    <!-- Eye -->
    <circle cx="100" cy="40" r="5" fill="#333"/>
    <text x="100" y="30" text-anchor="middle" font-size="10">œil</text>
    <line x1="100" y1="45" x2="100" y2="80" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="100" y="150" text-anchor="middle" font-size="11" fill="#c40">Surface plate — les détails</text>
    <text x="100" y="165" text-anchor="middle" font-size="11" fill="#c40">ne bougent pas avec la caméra</text>
  </g>

  <!-- Right: parallax mapping -->
  <g transform="translate(300, 30)">
    <text x="120" y="-10" text-anchor="middle" font-weight="bold">Parallax mapping</text>
    <!-- Surface with apparent depth -->
    <polygon points="10,80 190,80 210,120 -10,120" fill="url(#brickGrad)" stroke="#888"/>
    <!-- Height lines showing displacement -->
    <path d="M 20,78 Q 40,72 60,78 T 100,78 T 140,78 T 180,78" fill="none" stroke="#c40" stroke-width="1.5" opacity="0.6"/>
    <path d="M 15,82 Q 35,76 55,82 T 95,82 T 135,82 T 175,82" fill="none" stroke="#c40" stroke-width="1.5" opacity="0.4"/>

    <!-- Eye -->
    <circle cx="120" cy="40" r="5" fill="#333"/>
    <text x="120" y="30" text-anchor="middle" font-size="10">œil</text>

    <!-- View ray hitting displaced surface -->
    <line x1="120" y1="45" x2="80" y2="78" stroke="#00a" stroke-width="1.5" marker-end="url(#arr4)"/>
    <line x1="80" y1="78" x2="60" y2="95" stroke="#00a" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- UV offset arrow -->
    <line x1="100" y1="78" x2="80" y2="78" stroke="#c40" stroke-width="2" marker-end="url(#arr4)"/>
    <text x="90" y="72" text-anchor="middle" font-size="10" fill="#c40">ΔUV</text>

    <text x="120" y="150" text-anchor="middle" font-size="11" fill="#0a0">UVs décalées par la height map</text>
    <text x="120" y="165" text-anchor="middle" font-size="11" fill="#0a0">→ illusion de relief qui bouge</text>
  </g>

  <!-- POM ray marching -->
  <g transform="translate(20, 210)">
    <text x="260" y="-5" text-anchor="middle" font-weight="bold" fill="#333">Parallax Occlusion Mapping (ray-marching)</text>
    <!-- Height profile -->
    <path d="M 0,40 Q 30,10 60,25 Q 90,40 120,15 Q 150,5 180,30 Q 210,45 240,20 Q 270,35 300,25 L 300,60 L 0,60 Z"
          fill="#a07050" stroke="#555" stroke-width="1"/>
    <!-- Ray marching steps -->
    <line x1="0" y1="0" x2="300" y2="50" stroke="#00a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="50"  cy="8"  r="2.5" fill="#c40"/>
    <circle cx="100" cy="17" r="2.5" fill="#c40"/>
    <circle cx="150" cy="25" r="2.5" fill="#c40"/>
    <circle cx="200" cy="33" r="2.5" fill="#c40"/>
    <circle cx="250" cy="42" r="2.5" fill="#0a0"/>
    <text x="255" y="55" font-size="10" fill="#0a0">hit!</text>
    <text x="150" y="-5" text-anchor="middle" font-size="10" fill="#00a">vecteur de vue (tangent space)</text>
  </g>
</svg>
