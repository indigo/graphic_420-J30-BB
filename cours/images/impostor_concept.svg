<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="800" height="300" fill="#ffffff"/>

  <text x="400" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Impostor — le LOD extrême : un quad texturé au lieu d'un mesh</text>
  <text x="400" y="42" text-anchor="middle" font-size="12" fill="#666">on rend le mesh une fois dans une texture, puis on affiche la texture sur un billboard</text>

  <!-- Step 1: Real mesh -->
  <g transform="translate(120,160)">
    <text x="0" y="-65" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Étape 1</text>
    <text x="0" y="-50" text-anchor="middle" font-size="10" fill="#666">Mesh original</text>
    <!-- Castle silhouette -->
    <rect x="-40" y="-10" width="80" height="40" fill="#aaa" stroke="#666" stroke-width="1.5"/>
    <rect x="-45" y="-25" width="12" height="15" fill="#aaa" stroke="#666" stroke-width="1.5"/>
    <rect x="-6" y="-30" width="12" height="20" fill="#aaa" stroke="#666" stroke-width="1.5"/>
    <rect x="33" y="-25" width="12" height="15" fill="#aaa" stroke="#666" stroke-width="1.5"/>
    <text x="0" y="50" text-anchor="middle" font-size="10" fill="#cc4444">5 000 triangles</text>
  </g>

  <!-- Arrow -->
  <defs>
    <marker id="arrI" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>
  <line x1="195" y1="160" x2="265" y2="160" stroke="#888" stroke-width="2" marker-end="url(#arrI)"/>
  <text x="230" y="150" text-anchor="middle" font-size="9" fill="#888">rendre une fois</text>

  <!-- Step 2: Render to texture -->
  <g transform="translate(340,160)">
    <text x="0" y="-65" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Étape 2</text>
    <text x="0" y="-50" text-anchor="middle" font-size="10" fill="#666">Rendu dans une texture</text>
    <rect x="-45" y="-35" width="90" height="70" fill="#1a2a4a" stroke="#40a0ff" stroke-width="2" rx="3"/>
    <!-- Mini castle in texture -->
    <rect x="-25" y="-5" width="50" height="25" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <rect x="-28" y="-15" width="8" height="10" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <rect x="-4" y="-18" width="8" height="13" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <rect x="20" y="-15" width="8" height="10" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <text x="0" y="50" text-anchor="middle" font-size="10" fill="#2c6fb0">render target 256²</text>
  </g>

  <!-- Arrow -->
  <line x1="415" y1="160" x2="485" y2="160" stroke="#888" stroke-width="2" marker-end="url(#arrI)"/>
  <text x="450" y="150" text-anchor="middle" font-size="9" fill="#888">cache</text>

  <!-- Step 3: Billboard with texture -->
  <g transform="translate(560,160)">
    <text x="0" y="-65" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Étape 3</text>
    <text x="0" y="-50" text-anchor="middle" font-size="10" fill="#666">Billboard au loin</text>
    <rect x="-45" y="-35" width="90" height="70" fill="#1a2a4a" stroke="#4a9a4a" stroke-width="2" rx="3"/>
    <rect x="-25" y="-5" width="50" height="25" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <rect x="-28" y="-15" width="8" height="10" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <rect x="-4" y="-18" width="8" height="13" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <rect x="20" y="-15" width="8" height="10" fill="#888" stroke="#ccc" stroke-width="0.5"/>
    <text x="0" y="50" text-anchor="middle" font-size="10" fill="#4a9a4a">2 triangles</text>
  </g>

  <!-- Arrow -->
  <line x1="635" y1="160" x2="705" y2="160" stroke="#888" stroke-width="2" marker-end="url(#arrI)"/>

  <!-- Result: 2500x cheaper -->
  <g transform="translate(745,160)">
    <text x="0" y="-5" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a9a4a">2500×</text>
    <text x="0" y="15" text-anchor="middle" font-size="10" fill="#666">moins cher</text>
  </g>

  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#666">L'impostor est mis à jour périodiquement (ou par angle) quand l'objet se rapproche. Au-delà d'une certaine distance, il est visuellement identique au mesh.</text>
</svg>
