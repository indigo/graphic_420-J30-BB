<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="900" height="360" fill="#ffffff"/>

  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">LOD — Level of Detail : moins de triangles au loin</text>
  <text x="450" y="42" text-anchor="middle" font-size="12" fill="#666">l'objet lointain est petit à l'écran → on utilise une version simplifiée, visuellement identique</text>

  <!-- Camera on left -->
  <g transform="translate(40,180)">
    <rect x="-18" y="-12" width="30" height="20" rx="3" fill="#2c6fb0" stroke="#1c4a80" stroke-width="1.5"/>
    <polygon points="12,-8 22,-2 12,6" fill="#2c6fb0" stroke="#1c4a80" stroke-width="1.5"/>
    <text x="-3" y="30" text-anchor="middle" font-size="11" fill="#2c6fb0" font-weight="bold">Caméra</text>
  </g>

  <!-- Distance markers -->
  <line x1="80" y1="200" x2="850" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- LOD0 - close, high detail -->
  <g transform="translate(180,200)">
    <!-- Shark silhouette (detailed) -->
    <path d="M -50,0 Q -45,-15 -20,-18 L 10,-20 Q 35,-18 45,-10 L 50,-5 L 48,0 L 45,5 Q 35,12 10,15 L -20,15 Q -45,10 -50,0 Z
         M 45,-10 L 55,-22 L 50,-5 Z
         M -50,0 L -58,-8 L -55,0 L -58,8 Z
         M -30,15 L -35,25 L -25,20 Z
         M 0,15 L -5,25 L 5,20 Z
         M 25,15 L 20,25 L 30,20 Z"
          fill="#4a7ab0" stroke="#2a5a90" stroke-width="1"/>
    <text x="0" y="-35" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">LOD 0</text>
    <text x="0" y="45" text-anchor="middle" font-size="11" fill="#2a7a2a">2 188 tris</text>
    <text x="0" y="60" text-anchor="middle" font-size="10" fill="#888">jusqu'à 15m</text>
  </g>

  <defs>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrL2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Arrow -->
  <line x1="260" y1="200" x2="310" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrL)"/>

  <!-- LOD1 - medium -->
  <g transform="translate(370,200)">
    <path d="M -45,0 Q -40,-12 -18,-15 L 8,-17 Q 30,-15 40,-8 L 43,-3 L 42,3 L 40,8 Q 30,10 8,12 L -18,12 Q -40,8 -45,0 Z
         M 40,-8 L 48,-18 L 43,-3 Z
         M -45,0 L -50,-5 L -48,0 L -50,5 Z"
          fill="#4a7ab0" stroke="#2a5a90" stroke-width="1"/>
    <text x="0" y="-32" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">LOD 1</text>
    <text x="0" y="42" text-anchor="middle" font-size="11" fill="#2a7a2a">1 489 tris</text>
    <text x="0" y="57" text-anchor="middle" font-size="10" fill="#888">15m – 30m</text>
  </g>

  <!-- Arrow -->
  <line x1="440" y1="200" x2="490" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrL2)"/>

  <!-- LOD2 - far -->
  <g transform="translate(550,200)">
    <path d="M -38,0 Q -33,-8 -15,-10 L 5,-12 Q 25,-10 33,-5 L 35,0 L 33,5 Q 25,8 5,10 L -15,10 Q -33,6 -38,0 Z
         M 33,-5 L 40,-12 L 35,0 Z
         M -38,0 L -42,-3 L -40,0 L -42,3 Z"
          fill="#4a7ab0" stroke="#2a5a90" stroke-width="1"/>
    <text x="0" y="-28" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">LOD 2</text>
    <text x="0" y="38" text-anchor="middle" font-size="11" fill="#2a7a2a">869 tris</text>
    <text x="0" y="53" text-anchor="middle" font-size="10" fill="#888">30m – 60m</text>
  </g>

  <!-- Arrow -->
  <line x1="620" y1="200" x2="670" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrL2)"/>

  <!-- LOD3 - very far -->
  <g transform="translate(730,200)">
    <path d="M -28,0 Q -25,-5 -10,-7 L 3,-8 Q 18,-6 24,-3 L 25,0 L 24,3 Q 18,5 3,7 L -10,7 Q -25,4 -28,0 Z
         M 24,-3 L 30,-8 L 25,0 Z"
          fill="#4a7ab0" stroke="#2a5a90" stroke-width="1"/>
    <text x="0" y="-22" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">LOD 3</text>
    <text x="0" y="32" text-anchor="middle" font-size="11" fill="#2a7a2a">372 tris</text>
    <text x="0" y="47" text-anchor="middle" font-size="10" fill="#888">au-delà de 60m</text>
  </g>

  <!-- Screen-size indicator at bottom -->
  <g transform="translate(0,310)">
    <text x="180" y="0" text-anchor="middle" font-size="10" fill="#888">grand à l'écran</text>
    <rect x="150" y="5" width="60" height="8" fill="#4a7ab0" opacity="0.7"/>

    <text x="370" y="0" text-anchor="middle" font-size="10" fill="#888">moyen</text>
    <rect x="350" y="5" width="40" height="8" fill="#4a7ab0" opacity="0.5"/>

    <text x="550" y="0" text-anchor="middle" font-size="10" fill="#888">petit</text>
    <rect x="538" y="5" width="24" height="8" fill="#4a7ab0" opacity="0.35"/>

    <text x="730" y="0" text-anchor="middle" font-size="10" fill="#888">minuscule</text>
    <rect x="722" y="5" width="16" height="8" fill="#4a7ab0" opacity="0.2"/>

    <text x="450" y="35" text-anchor="middle" font-size="11" fill="#666">taille apparente à l'écran (le GPU dessine moins de pixels → moins de triangles suffit)</text>
  </g>
</svg>
