<svg width="900" height="380" viewBox="0 0 900 380" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="450" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Billboard — un quad qui fait toujours face à la caméra</text>
  <text x="450" y="42" text-anchor="middle" font-size="12" fill="#666">la géométrie est un simple rectangle ; la "3D" est dans la texture</text>

  <!-- Top view (top-down) -->
  <text x="250" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Vue de dessus</text>

  <!-- Camera -->
  <g transform="translate(100,200)">
    <rect x="-15" y="-10" width="25" height="18" rx="3" fill="#2c6fb0" stroke="#1c4a80" stroke-width="1.5"/>
    <polygon points="10,-6 18,-1 10,5" fill="#2c6fb0" stroke="#1c4a80" stroke-width="1.5"/>
    <text x="-3" y="25" text-anchor="middle" font-size="10" fill="#2c6fb0">caméra</text>
  </g>

  <!-- Camera frustum lines -->
  <line x1="118" y1="200" x2="400" y2="120" stroke="#2c6fb0" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="118" y1="200" x2="400" y2="280" stroke="#2c6fb0" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Tree as billboard (line from above, always perpendicular to camera) -->
  <!-- Position 1 -->
  <g transform="translate(250,200)">
    <!-- Billboard quad seen from above = a line -->
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#4a9a4a" stroke-width="4"/>
    <text x="0" y="-10" text-anchor="middle" font-size="9" fill="#4a9a4a">billboard</text>
  </g>

  <!-- Position 2 (camera moved) -->
  <g transform="translate(350,150)">
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#4a9a4a" stroke-width="4" transform="rotate(45)"/>
    <text x="25" y="-5" text-anchor="middle" font-size="9" fill="#4a9a4a">billboard</text>
  </g>

  <!-- Arrow showing camera rotation -->
  <path d="M 100,170 Q 80,160 90,145" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Right side: 3D view of billboard -->
  <text x="650" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Vue 3D</text>

  <!-- Tree texture on a quad -->
  <g transform="translate(650,200)">
    <!-- Quad (transparent border) -->
    <rect x="-50" y="-80" width="100" height="160" fill="none" stroke="#cc4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="55" y="-75" text-anchor="start" font-size="9" fill="#cc4444">quad (2 tris)</text>

    <!-- Tree image on the quad -->
    <ellipse cx="0" cy="-40" rx="35" ry="45" fill="#4a9a4a" stroke="#2a7a2a" stroke-width="1.5"/>
    <rect x="-6" y="5" width="12" height="30" fill="#6b4a2a" stroke="#4a3010" stroke-width="1"/>
    <ellipse cx="-15" cy="-30" rx="12" ry="15" fill="#5aaa5a" opacity="0.6"/>
    <ellipse cx="12" cy="-50" rx="10" ry="12" fill="#3a8a3a" opacity="0.6"/>

    <text x="0" y="95" text-anchor="middle" font-size="10" fill="#666">texture appliquée sur le quad</text>
  </g>

  <!-- Bottom: use cases -->
  <g transform="translate(50,310)">
    <rect x="0" y="0" width="800" height="60" rx="6" fill="#f5f5f5" stroke="#ddd"/>
    <text x="10" y="20" font-size="11" font-weight="bold" fill="#444">Cas d'usage :</text>
    <text x="10" y="38" font-size="11" fill="#444">• Particules (fumée, feu, étincelles) — des milliers de quads texturés</text>
    <text x="280" y="38" font-size="11" fill="#444">• Végétation (herbe, arbres lointains)</text>
    <text x="510" y="38" font-size="11" fill="#444">• Impostors (remplacement d'un mesh complexe)</text>
    <text x="10" y="52" font-size="11" fill="#444">• Halos, effets d'épée, sprites</text>
    <text x="280" y="52" font-size="11" fill="#444">• HUD in-world (panneaux, icônes)</text>
  </g>

  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
