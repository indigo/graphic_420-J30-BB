<svg width="800" height="360" viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c6fb0"/>
    </marker>
  </defs>

  <rect width="800" height="360" fill="#ffffff"/>

  <text x="400" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Frustum Culling — ne rendre que ce que la caméra voit</text>
  <text x="400" y="42" text-anchor="middle" font-size="12" fill="#666">les objets hors du frustum (rouge) sont éliminés avant l'envoi au GPU</text>

  <!-- Frustum (pyramid from camera) -->
  <!-- Camera position -->
  <g transform="translate(80,180)">
    <rect x="-18" y="-12" width="30" height="20" rx="3" fill="#2c6fb0" stroke="#1c4a80" stroke-width="1.5"/>
    <polygon points="12,-8 22,-2 12,6" fill="#2c6fb0" stroke="#1c4a80" stroke-width="1.5"/>
    <text x="-3" y="30" text-anchor="middle" font-size="11" fill="#2c6fb0" font-weight="bold">Caméra</text>
  </g>

  <!-- Frustum lines -->
  <path d="M 102,180 L 720,80 L 720,280 Z" fill="#2c6fb0" fill-opacity="0.06" stroke="#2c6fb0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Far plane label -->
  <text x="730" y="180" text-anchor="middle" font-size="10" fill="#2c6fb0" transform="rotate(90 730 180)">far plane</text>

  <!-- Objects INSIDE frustum (green, rendered) -->
  <!-- Tree 1 -->
  <g transform="translate(300,140)">
    <polygon points="0,-25 -18,15 18,15" fill="#4a9a4a" stroke="#2a7a2a" stroke-width="1.5"/>
    <rect x="-4" y="15" width="8" height="10" fill="#6b4a2a"/>
    <text x="0" y="-32" text-anchor="middle" font-size="9" fill="#2a7a2a">✓ rendu</text>
  </g>
  <!-- Tree 2 -->
  <g transform="translate(500,200)">
    <polygon points="0,-25 -18,15 18,15" fill="#4a9a4a" stroke="#2a7a2a" stroke-width="1.5"/>
    <rect x="-4" y="15" width="8" height="10" fill="#6b4a2a"/>
    <text x="0" y="-32" text-anchor="middle" font-size="9" fill="#2a7a2a">✓ rendu</text>
  </g>
  <!-- House -->
  <g transform="translate(600,120)">
    <rect x="-20" y="-5" width="40" height="25" fill="#c8a060" stroke="#8a6830" stroke-width="1.5"/>
    <polygon points="-25,-5 0,-25 25,-5" fill="#a0403a" stroke="#6a2020" stroke-width="1.5"/>
    <text x="0" y="-32" text-anchor="middle" font-size="9" fill="#2a7a2a">✓ rendu</text>
  </g>

  <!-- Objects OUTSIDE frustum (red, culled) -->
  <!-- Tree outside top -->
  <g transform="translate(350,50)">
    <polygon points="0,-22 -15,12 15,12" fill="#aaa" stroke="#cc4444" stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="-3" y="12" width="6" height="8" fill="#aaa"/>
    <text x="0" y="-28" text-anchor="middle" font-size="9" fill="#cc4444">✗ culled</text>
  </g>
  <!-- Tree outside bottom -->
  <g transform="translate(200,320)">
    <polygon points="0,-22 -15,12 15,12" fill="#aaa" stroke="#cc4444" stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="-3" y="12" width="6" height="8" fill="#aaa"/>
    <text x="0" y="-28" text-anchor="middle" font-size="9" fill="#cc4444">✗ culled</text>
  </g>
  <!-- Tree outside left -->
  <g transform="translate(50,280)">
    <polygon points="0,-22 -15,12 15,12" fill="#aaa" stroke="#cc4444" stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="-3" y="12" width="6" height="8" fill="#aaa"/>
    <text x="0" y="-28" text-anchor="middle" font-size="9" fill="#cc4444">✗ culled</text>
  </g>
  <!-- Tree outside right -->
  <g transform="translate(750,320)">
    <polygon points="0,-22 -15,12 15,12" fill="#aaa" stroke="#cc4444" stroke-width="1.5" stroke-dasharray="3,2"/>
    <rect x="-3" y="12" width="6" height="8" fill="#aaa"/>
    <text x="0" y="-28" text-anchor="middle" font-size="9" fill="#cc4444">✗ culled</text>
  </g>

  <!-- Bounding spheres (dashed circles around visible objects) -->
  <circle cx="300" cy="152" r="30" fill="none" stroke="#2c6fb0" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <circle cx="500" cy="212" r="30" fill="none" stroke="#2c6fb0" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <circle cx="600" cy="122" r="35" fill="none" stroke="#2c6fb0" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

  <text x="400" y="345" text-anchor="middle" font-size="11" fill="#666">Le moteur teste la sphère englobante de chaque objet contre les 6 plans du frustum. Intersection → on rend. Hors → on skip.</text>
</svg>
