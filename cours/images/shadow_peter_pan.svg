<svg width="920" height="320" viewBox="0 0 920 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <radialGradient id="lightGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="320" fill="#ffffff"/>

  <!-- ===== Contact correct ===== -->
  <g transform="translate(40,40)">
    <text x="200" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c8a4a">Bias correct — contact préservé</text>

    <!-- sol -->
    <line x1="20" y1="200" x2="380" y2="200" stroke="#444" stroke-width="2"/>
    <g stroke="#bbb" stroke-width="1">
      <line x1="40" y1="200" x2="30" y2="212"/>
      <line x1="120" y1="200" x2="110" y2="212"/>
      <line x1="200" y1="200" x2="190" y2="212"/>
      <line x1="280" y1="200" x2="270" y2="212"/>
      <line x1="360" y1="200" x2="350" y2="212"/>
    </g>

    <!-- objet (cube) posé sur le sol -->
    <rect x="170" y="120" width="60" height="80" fill="#6b7280" stroke="#374151" stroke-width="1.8"/>

    <!-- lumière -->
    <circle cx="60" cy="50" r="20" fill="url(#lightGlow3)"/>
    <circle cx="60" cy="50" r="8" fill="#fff4c2" stroke="#e0921a" stroke-width="1.4"/>
    <g stroke="#f5a623" stroke-width="1.2" stroke-dasharray="3 3">
      <line x1="68" y1="56" x2="170" y2="124"/>
      <line x1="68" y1="56" x2="170" y2="200"/>
    </g>

    <!-- ombre portée attachée au cube -->
    <ellipse cx="200" cy="202" rx="40" ry="5" fill="#111" fill-opacity="0.5"/>
    <text x="200" y="240" text-anchor="middle" font-size="11" fill="#2c8a4a">l'ombre touche la base du cube</text>
  </g>

  <!-- ===== Peter panning ===== -->
  <g transform="translate(500,40)">
    <text x="200" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Bias trop grand — Peter Panning</text>

    <line x1="20" y1="200" x2="380" y2="200" stroke="#444" stroke-width="2"/>
    <g stroke="#bbb" stroke-width="1">
      <line x1="40" y1="200" x2="30" y2="212"/>
      <line x1="120" y1="200" x2="110" y2="212"/>
      <line x1="200" y1="200" x2="190" y2="212"/>
      <line x1="280" y1="200" x2="270" y2="212"/>
      <line x1="360" y1="200" x2="350" y2="212"/>
    </g>

    <!-- cube légèrement décollé visuellement (l'ombre commence plus loin) -->
    <rect x="170" y="120" width="60" height="80" fill="#6b7280" stroke="#374151" stroke-width="1.8"/>

    <circle cx="60" cy="50" r="20" fill="url(#lightGlow3)"/>
    <circle cx="60" cy="50" r="8" fill="#fff4c2" stroke="#e0921a" stroke-width="1.4"/>
    <g stroke="#f5a623" stroke-width="1.2" stroke-dasharray="3 3">
      <line x1="68" y1="56" x2="170" y2="124"/>
      <line x1="68" y1="56" x2="170" y2="200"/>
    </g>

    <!-- ombre décollée du cube (gap visible) -->
    <ellipse cx="230" cy="202" rx="40" ry="5" fill="#111" fill-opacity="0.5"/>
    <!-- flèche gap -->
    <g stroke="#c0392b" stroke-width="1.6">
      <line x1="200" y1="206" x2="225" y2="206"/>
    </g>
    <text x="212" y="222" text-anchor="middle" font-size="11" fill="#c0392b" font-style="italic">gap</text>
    <text x="200" y="240" text-anchor="middle" font-size="11" fill="#c0392b">l'ombre "flotte", le cube semble décollé</text>
  </g>

  <text x="460" y="300" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Peter Panning : un bias excessif repousse l'ombre trop loin, l'objet paraît flotter au-dessus de son ombre. Comme Peter Pan qui ne touche plus le sol.</text>
</svg>
