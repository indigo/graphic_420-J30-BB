<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <pattern id="texPat" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#c8a070"/>
      <circle cx="10" cy="10" r="3" fill="#a07050"/>
    </pattern>
  </defs>

  <!-- 3 planes projection -->
  <!-- Rock/object in center -->
  <g transform="translate(260, 160)">
    <!-- Irregular rock shape -->
    <polygon points="-30,-20 -10,-35 20,-30 35,-10 30,20 10,35 -20,30 -35,10"
             fill="#888" stroke="#555" stroke-width="1.5"/>
    <!-- Normal vector -->
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#0a0" stroke-width="2.5" marker-end="url(#arr3)"/>
    <text x="5" y="-45" fill="#0a0" font-weight="bold">n</text>
  </g>

  <!-- Plane X (YZ projection, from the side) -->
  <g transform="translate(100, 160)">
    <rect x="-50" y="-60" width="100" height="120" fill="url(#texPat)" opacity="0.5" stroke="#c40" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="-70" text-anchor="middle" fill="#c40" font-weight="bold">Plan YZ</text>
    <text x="0" y="75" text-anchor="middle" font-size="10" fill="#c40">proj. X → pos.yz</text>
  </g>

  <!-- Plane Y (XZ projection, from top) -->
  <g transform="translate(260, 60)">
    <rect x="-60" y="-30" width="120" height="60" fill="url(#texPat)" opacity="0.5" stroke="#00a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="-38" text-anchor="middle" fill="#00a" font-weight="bold">Plan XZ</text>
    <text x="0" y="45" text-anchor="middle" font-size="10" fill="#00a">proj. Y → pos.xz</text>
  </g>

  <!-- Plane Z (XY projection, from front) -->
  <g transform="translate(420, 160)">
    <rect x="-50" y="-60" width="100" height="120" fill="url(#texPat)" opacity="0.5" stroke="#a0a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="-70" text-anchor="middle" fill="#a0a" font-weight="bold">Plan XY</text>
    <text x="0" y="75" text-anchor="middle" font-size="10" fill="#a0a">proj. Z → pos.xy</text>
  </g>

  <!-- Weight formula -->
  <text x="260" y="290" text-anchor="middle" font-size="13" fill="#333">
    w = |n|^p  →  color = (w_x·proj_x + w_y·proj_y + w_z·proj_z) / (w_x + w_y + w_z)
  </text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#666">La normale détermine quelle projection domine</text>
</svg>
