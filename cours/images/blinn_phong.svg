<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <marker id="arrN4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c6fb0"/>
    </marker>
    <marker id="arrL4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrV4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e7d3a"/>
    </marker>
    <marker id="arrR4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222"/>
    </marker>
    <marker id="arrH4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8e44ad"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>

  <!-- ===== Panneau gauche : Phong ===== -->
  <g transform="translate(225,220)">
    <text x="0" y="-180" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Phong : R · V</text>
    <!-- surface -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#444" stroke-width="3"/>
    <g stroke="#bbb" stroke-width="1">
      <line x1="-110" y1="0" x2="-120" y2="12"/>
      <line x1="-80" y1="0" x2="-90" y2="12"/>
      <line x1="-50" y1="0" x2="-60" y2="12"/>
      <line x1="-20" y1="0" x2="-30" y2="12"/>
      <line x1="10" y1="0" x2="0" y2="12"/>
      <line x1="40" y1="0" x2="30" y2="12"/>
      <line x1="70" y1="0" x2="60" y2="12"/>
      <line x1="100" y1="0" x2="90" y2="12"/>
    </g>
    <circle cx="0" cy="0" r="3.5" fill="#222"/>
    <!-- N -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#2c6fb0" stroke-width="2.5" marker-end="url(#arrN4)"/>
    <text x="10" y="-120" font-size="16" fill="#2c6fb0" font-style="italic">N</text>
    <!-- L depuis haut-gauche -->
    <line x1="-90" y1="-120" x2="-3" y2="-3" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrL4)"/>
    <text x="-100" y="-125" font-size="16" fill="#c0392b" font-style="italic">L</text>
    <!-- R reflechi vers haut-droit -->
    <line x1="0" y1="0" x2="90" y2="-120" stroke="#222" stroke-width="2.5" marker-end="url(#arrR4)"/>
    <text x="98" y="-120" font-size="16" fill="#222" font-style="italic">R</text>
    <!-- V depuis haut-droit (plus eloigne) -->
    <line x1="120" y1="-150" x2="3" y2="-3" stroke="#1e7d3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrV4)"/>
    <text x="128" y="-150" font-size="16" fill="#1e7d3a" font-style="italic">V</text>
    <!-- formule -->
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#222" font-style="italic">k_s = max(R · V, 0)^shininess</text>
    <text x="0" y="85" text-anchor="middle" font-size="12" fill="#666">nécessite de calculer R (réflexion)</text>
  </g>

  <!-- Separateur vertical -->
  <line x1="450" y1="40" x2="450" y2="380" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== Panneau droit : Blinn-Phong ===== -->
  <g transform="translate(675,220)">
    <text x="0" y="-180" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Blinn-Phong : N · H</text>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#444" stroke-width="3"/>
    <g stroke="#bbb" stroke-width="1">
      <line x1="-110" y1="0" x2="-120" y2="12"/>
      <line x1="-80" y1="0" x2="-90" y2="12"/>
      <line x1="-50" y1="0" x2="-60" y2="12"/>
      <line x1="-20" y1="0" x2="-30" y2="12"/>
      <line x1="10" y1="0" x2="0" y2="12"/>
      <line x1="40" y1="0" x2="30" y2="12"/>
      <line x1="70" y1="0" x2="60" y2="12"/>
      <line x1="100" y1="0" x2="90" y2="12"/>
    </g>
    <circle cx="0" cy="0" r="3.5" fill="#222"/>
    <!-- N -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#2c6fb0" stroke-width="2.5" marker-end="url(#arrN4)"/>
    <text x="10" y="-120" font-size="16" fill="#2c6fb0" font-style="italic">N</text>
    <!-- L depuis haut-gauche -->
    <line x1="-90" y1="-120" x2="-3" y2="-3" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrL4)"/>
    <text x="-100" y="-125" font-size="16" fill="#c0392b" font-style="italic">L</text>
    <!-- V depuis haut-droit -->
    <line x1="120" y1="-150" x2="3" y2="-3" stroke="#1e7d3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrV4)"/>
    <text x="128" y="-150" font-size="16" fill="#1e7d3a" font-style="italic">V</text>
    <!-- H = normalize(L + V) : vecteur half-angle au milieu -->
    <!-- point intermediaire = (L_point + V_point)/2 approx -->
    <line x1="0" y1="0" x2="20" y2="-135" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#arrH4)"/>
    <text x="28" y="-130" font-size="16" fill="#8e44ad" font-style="italic">H</text>
    <text x="0" y="60" text-anchor="middle" font-size="15" fill="#222" font-style="italic">k_s = max(N · H, 0)^shininess</text>
    <text x="0" y="85" text-anchor="middle" font-size="12" fill="#666">H = normalize(L + V) — une addition suffit</text>
  </g>

  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Blinn-Phong remplace R (coûteux) par H = normalize(L + V). Visuellement équivalent, plus rapide.</text>
</svg>
