<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f5a623" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="900" height="360" fill="#ffffff"/>

  <!-- ===== Petite source (ombre douce) ===== -->
  <g transform="translate(160,180)">
    <text x="0" y="-150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Source étendue</text>
    <text x="0" y="-132" text-anchor="middle" font-size="12" fill="#666">ombre douce (pénombre large)</text>
    <!-- source étendue -->
    <circle cx="0" cy="-90" r="38" fill="url(#sunGlow)" stroke="#e0921a" stroke-width="1.5"/>
    <circle cx="0" cy="-90" r="14" fill="#fff4c2" stroke="#e0921a" stroke-width="1.2"/>
    <!-- objet -->
    <rect x="-26" y="-30" width="52" height="60" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
    <!-- rayons extremes depuis le haut et le bas de la source -->
    <g stroke="#f5a623" stroke-width="1.4" stroke-dasharray="4 3">
      <!-- rayon haut source -> haut objet -> sol -->
      <line x1="-30" y1="-104" x2="-26" y2="-30"/>
      <line x1="-26" y1="-30" x2="-78" y2="55"/>
      <!-- rayon bas source -> bas objet -> sol -->
      <line x1="30" y1="-76" x2="26" y2="30"/>
      <line x1="26" y1="30" x2="92" y2="55"/>
    </g>
    <!-- sol -->
    <line x1="-120" y1="55" x2="120" y2="55" stroke="#444" stroke-width="2"/>
    <g stroke="#bbb" stroke-width="1">
      <line x1="-120" y1="55" x2="-130" y2="67"/>
      <line x1="-80" y1="55" x2="-90" y2="67"/>
      <line x1="-40" y1="55" x2="-50" y2="67"/>
      <line x1="0" y1="55" x2="-10" y2="67"/>
      <line x1="40" y1="55" x2="30" y2="67"/>
      <line x1="80" y1="55" x2="70" y2="67"/>
      <line x1="120" y1="55" x2="110" y2="67"/>
    </g>
    <!-- ombre: umbra (pleine) + penumbra (dégradé) -->
    <!-- penumbra gauche -->
    <path d="M -78 55 L -26 55 L 26 55 L 92 55 Z" fill="#000" fill-opacity="0.0"/>
    <!-- dégradés de pénombre -->
    <path d="M -78 55 L -26 55 L -26 60 L -78 60 Z" fill="#444" fill-opacity="0.35"/>
    <path d="M 92 55 L 26 55 L 26 60 L 92 60 Z" fill="#444" fill-opacity="0.35"/>
    <!-- umbra -->
    <rect x="-26" y="55" width="52" height="5" fill="#111"/>
    <text x="-52" y="80" text-anchor="middle" font-size="11" fill="#7a5300" font-style="italic">pénombre</text>
    <text x="0" y="80" text-anchor="middle" font-size="11" fill="#111" font-weight="bold">umbra</text>
    <text x="60" y="80" text-anchor="middle" font-size="11" fill="#7a5300" font-style="italic">pénombre</text>
  </g>

  <!-- ===== Source ponctuelle (ombre dure) ===== -->
  <g transform="translate(560,180)">
    <text x="0" y="-150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Source ponctuelle</text>
    <text x="0" y="-132" text-anchor="middle" font-size="12" fill="#666">ombre dure (pas de pénombre)</text>
    <!-- source ponctuelle -->
    <circle cx="0" cy="-90" r="9" fill="#fff4c2" stroke="#e0921a" stroke-width="1.5"/>
    <circle cx="0" cy="-90" r="20" fill="url(#sunGlow)"/>
    <!-- objet -->
    <rect x="-26" y="-30" width="52" height="60" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
    <!-- rayons depuis le point unique -->
    <g stroke="#f5a623" stroke-width="1.4" stroke-dasharray="4 3">
      <line x1="0" y1="-90" x2="-26" y2="-30"/>
      <line x1="-26" y1="-30" x2="-58" y2="55"/>
      <line x1="0" y1="-90" x2="26" y2="30"/>
      <line x1="26" y1="30" x2="58" y2="55"/>
    </g>
    <!-- sol -->
    <line x1="-120" y1="55" x2="120" y2="55" stroke="#444" stroke-width="2"/>
    <g stroke="#bbb" stroke-width="1">
      <line x1="-120" y1="55" x2="-130" y2="67"/>
      <line x1="-80" y1="55" x2="-90" y2="67"/>
      <line x1="-40" y1="55" x2="-50" y2="67"/>
      <line x1="0" y1="55" x2="-10" y2="67"/>
      <line x1="40" y1="55" x2="30" y2="67"/>
      <line x1="80" y1="55" x2="70" y2="67"/>
      <line x1="120" y1="55" x2="110" y2="67"/>
    </g>
    <!-- ombre nette (umbra seule) -->
    <rect x="-58" y="55" width="116" height="5" fill="#111"/>
    <text x="0" y="80" text-anchor="middle" font-size="11" fill="#111" font-weight="bold">umbra seulement</text>
  </g>

  <!-- ===== Légende droite : terminologie ===== -->
  <g transform="translate(770,60)">
    <rect x="0" y="0" width="120" height="240" rx="6" fill="#f7f7f4" stroke="#ccc" stroke-width="1"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Vocabulaire</text>
    <text x="10" y="48" font-size="11" fill="#222" font-weight="bold">Ombre propre</text>
    <text x="10" y="62" font-size="10" fill="#555">sur l'objet lui-même</text>
    <text x="10" y="88" font-size="11" fill="#222" font-weight="bold">Ombre portée</text>
    <text x="10" y="102" font-size="10" fill="#555">projetée sur le sol</text>
    <text x="10" y="128" font-size="11" fill="#111" font-weight="bold">Umbra</text>
    <text x="10" y="142" font-size="10" fill="#555">zone totalement</text>
    <text x="10" y="154" font-size="10" fill="#555">cachée de la source</text>
    <text x="10" y="180" font-size="11" fill="#7a5300" font-weight="bold">Pénombre</text>
    <text x="10" y="194" font-size="10" fill="#555">partiellement cachée</text>
    <text x="10" y="206" font-size="10" fill="#555">(bord flou)</text>
    <text x="10" y="228" font-size="10" fill="#888" font-style="italic">Source étendue ⇒</text>
    <text x="10" y="238" font-size="10" fill="#888" font-style="italic">pénombre réelle</text>
  </g>

  <text x="450" y="345" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Anatomie d'une ombre : umbra (cœur plein) et pénombre (bord adouci). Une source ponctuelle idéale ne produit que de l'umbra.</text>
</svg>
