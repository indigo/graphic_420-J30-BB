<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="sans-serif" font-size="12">
  <!-- Texture Atlas -->
  <g transform="translate(20, 20)">
    <text x="120" y="-5" text-anchor="middle" font-weight="bold">Texture Atlas</text>
    <!-- Big texture 240x200 -->
    <rect x="0" y="10" width="240" height="200" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
    <!-- Sub-textures -->
    <rect x="5"   y="15"  width="115" height="95" fill="#e8a060" stroke="#c08040"/>
    <rect x="120" y="15"  width="115" height="95" fill="#60b080" stroke="#408060"/>
    <rect x="5"   y="110" width="115" height="95" fill="#6090d0" stroke="#4060a0"/>
    <rect x="120" y="110" width="115" height="95" fill="#d06060" stroke="#a04040"/>
    <text x="62"  y="65" text-anchor="middle" fill="#fff" font-size="11">Tex A</text>
    <text x="177" y="65" text-anchor="middle" fill="#fff" font-size="11">Tex B</text>
    <text x="62"  y="160" text-anchor="middle" fill="#fff" font-size="11">Tex C</text>
    <text x="177" y="160" text-anchor="middle" fill="#fff" font-size="11">Tex D</text>

    <text x="120" y="235" text-anchor="middle" font-size="11" fill="#666">1 texture, 4 sous-régions</text>
    <text x="120" y="250" text-anchor="middle" font-size="11" fill="#c40">⚠ pas de repeat (wrapping)</text>
  </g>

  <!-- Texture Array -->
  <g transform="translate(320, 20)">
    <text x="120" y="-5" text-anchor="middle" font-weight="bold">Texture Array</text>
    <!-- Stack of 4 layers -->
    <rect x="50"  y="30"  width="140" height="100" fill="#e8a060" stroke="#c08040" stroke-width="1.5"/>
    <rect x="55"  y="35"  width="140" height="100" fill="#60b080" stroke="#408060" stroke-width="1.5"/>
    <rect x="60"  y="40"  width="140" height="100" fill="#6090d0" stroke="#4060a0" stroke-width="1.5"/>
    <rect x="65"  y="45"  width="140" height="100" fill="#d06060" stroke="#a04040" stroke-width="1.5"/>

    <!-- Layer labels -->
    <text x="135" y="70"  text-anchor="middle" fill="#fff" font-size="10">layer 3</text>
    <text x="140" y="85"  text-anchor="middle" fill="#fff" font-size="10">layer 2</text>
    <text x="145" y="100" text-anchor="middle" fill="#fff" font-size="10">layer 1</text>
    <text x="150" y="115" text-anchor="middle" fill="#fff" font-size="10">layer 0</text>

    <!-- Sampling arrow -->
    <text x="135" y="175" text-anchor="middle" font-size="11" fill="#333">texture(sampler, vec3(uv, layer))</text>
    <text x="120" y="235" text-anchor="middle" font-size="11" fill="#666">N textures, même taille</text>
    <text x="120" y="250" text-anchor="middle" font-size="11" fill="#0a0">✓ repeat préservé</text>
  </g>
</svg>
