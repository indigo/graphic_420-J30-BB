<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif" font-size="12">
  <defs>
    <pattern id="basePat" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#b89878"/>
      <circle cx="20" cy="20" r="8" fill="#a08060" opacity="0.5"/>
    </pattern>
    <pattern id="detailPat" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#808080"/>
      <circle cx="5" cy="5" r="1.5" fill="#606060"/>
    </pattern>
  </defs>

  <!-- Base texture (low res, blurry up close) -->
  <g transform="translate(20, 30)">
    <text x="80" y="-10" text-anchor="middle" font-weight="bold">Base (2048²)</text>
    <rect x="0" y="0" width="160" height="120" fill="url(#basePat)" stroke="#888"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" fill="#666">~200 texels/m</text>
    <text x="80" y="155" text-anchor="middle" font-size="11" fill="#c40">flou de près</text>
  </g>

  <!-- Plus sign -->
  <text x="220" y="100" text-anchor="middle" font-size="28" fill="#333" font-weight="bold">+</text>

  <!-- Detail texture (small, tiled) -->
  <g transform="translate(260, 30)">
    <text x="80" y="-10" text-anchor="middle" font-weight="bold">Détail (512², ×10)</text>
    <rect x="0" y="0" width="160" height="120" fill="url(#detailPat)" stroke="#888"/>
    <text x="80" y="140" text-anchor="middle" font-size="11" fill="#666">~2000 texels/m</text>
    <text x="80" y="155" text-anchor="middle" font-size="11" fill="#0a0">grain fin</text>
  </g>

  <!-- Equals sign -->
  <text x="260" y="200" text-anchor="middle" font-size="28" fill="#333" font-weight="bold">=</text>

  <!-- Result -->
  <g transform="translate(140, 210)">
    <rect x="0" y="0" width="240" height="40" fill="url(#basePat)" stroke="#888"/>
    <rect x="0" y="0" width="240" height="40" fill="url(#detailPat)" opacity="0.35"/>
    <text x="120" y="25" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">Résultat : base × (0.5 + détail × 0.5)</text>
  </g>
</svg>
